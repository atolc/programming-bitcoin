version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      vite:
        patterns:
          - vite
          - '@vitejs/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - tw-animate-css
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
